# Use case configuration for Realme GT Master Edition

SectionVerb {
	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"

	Include.wcdhpe.File "/codecs/wcd937x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd937x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP Digital"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic1" {
	Comment "Bottom Microphone (AMIC1)"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"

		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
	]

	DisableSequence [
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"

		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
	]

	Value {
		CaptureChannels 1
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Mic2" {
	Comment "Headset Microphone (AMIC2)"

	EnableSequence [
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' ADC1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC1 Volume' 84"

		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Switch' 1"
	]

	DisableSequence [
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"

		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 Switch' 0"
	]

	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
	}
}

SectionDevice."Mic3" {
	Comment "Top Microphone (AMIC3)"

	EnableSequence [
		cset "name='TX DEC2 MUX' SWR_MIC"
		cset "name='TX SMIC MUX2' ADC2"
		cset "name='TX_AIF1_CAP Mixer DEC2' 1"
		cset "name='TX_DEC2 Volume' 84"

		cset "name='ADC3_MIXER Switch' 1"
		cset "name='ADC3 Switch' 1"
	]

	DisableSequence [
		cset "name='TX SMIC MUX2' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC2' 0"

		cset "name='ADC3_MIXER Switch' 0"
		cset "name='ADC3 Switch' 0"
	]

	Value {
		CaptureChannels 1
		CapturePriority 50
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC3"
	}
}